[project]
name = "voiceguard-backend"
version = "0.1.0"
description = "AI-powered voice clone detection backend — real-time spoof scoring for phone calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "VoiceGuard Team" }
]

dependencies = [
    # --- Web framework & server ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # --- ML / Deep learning ---
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "torchcrepe>=0.0.22",

    # --- DSP / Audio processing ---
    "librosa>=0.10.2",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "audioop-lts>=0.2.1",

    # --- Feature-based ML ---
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",

    # --- NLP / Embeddings ---
    "sentence-transformers>=3.0.0",

    # --- Redis ---
    "redis[hiredis]>=5.0.0",

    # --- AWS services ---
    "boto3>=1.34.0",

    # --- Twilio ---
    "twilio>=9.0.0",

    # --- Silero VAD ---
    "silero-vad>=5.1",

    # --- Configuration & utilities ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "moto[dynamodb]>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.25.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
